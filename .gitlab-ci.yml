# ---------------------------------------------------------------------------
# terraform-deploy-openstack — GitLab CI Pipeline
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#
#   OS_CLOUDS_YAML   — contents of your clouds.yaml             (file type)
#   TF_VARS_FILE     — contents of your terraform.tfvars        (file type)
#   SSH_PUBLIC_KEY   — public SSH key for the baremetal user     (masked)
# ---------------------------------------------------------------------------

default:
  image: hashicorp/terraform:1.7
  before_script:
    - apk add --no-cache bash python3 py3-pip
    - pip3 install --quiet openstacksdk
    - mkdir -p ~/.config/openstack
    - cp "$OS_CLOUDS_YAML" ~/.config/openstack/clouds.yaml
    - cp "$TF_VARS_FILE" terraform.tfvars
    - echo "ssh_public_key = \"$SSH_PUBLIC_KEY\"" >> terraform.tfvars
    - terraform --version

variables:
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"

stages:
  - validate
  - plan
  - apply
  - output

# ---------------------------------------------------------------------------
# Validate
# ---------------------------------------------------------------------------
validate:
  stage: validate
  before_script:
    - terraform --version
  script:
    - terraform init -backend=false -input=false
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---------------------------------------------------------------------------
# Plan — preview changes on every push to main
# ---------------------------------------------------------------------------
plan:
  stage: plan
  script:
    - source setup_env.sh
    - terraform init -input=false \
        -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox" \
        -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox/lock" \
        -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox/lock" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="retry_wait_min=5"
    - terraform plan -out=tfplan -input=false
  artifacts:
    paths:
      - tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ---------------------------------------------------------------------------
# Apply — manual trigger, uses saved plan
# ---------------------------------------------------------------------------
deploy:
  stage: apply
  script:
    - source setup_env.sh
    - terraform init -input=false \
        -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox" \
        -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox/lock" \
        -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox/lock" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="retry_wait_min=5"
    - terraform apply -auto-approve -input=false tfplan
  environment:
    name: jumpbox
  when: manual
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ---------------------------------------------------------------------------
# Output — print connection details after deploy
# ---------------------------------------------------------------------------
show_outputs:
  stage: output
  script:
    - source setup_env.sh
    - terraform init -input=false \
        -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox" \
        -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox/lock" \
        -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/jumpbox/lock" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="retry_wait_min=5"
    - terraform output
  needs: [deploy]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
